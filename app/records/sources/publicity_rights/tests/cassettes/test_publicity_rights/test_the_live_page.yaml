        \                               <h1>Personality's Right of Publicity</h1>\r\n
        \                               \r\n                                \r\n\t\r\n\t
        \       <p>Pursuant to <a target=\"_blank\" href=\"http://sdlegislature.gov/Statutes/Codified_Laws/DisplayStatute.aspx?Type=Statute&Statute=21-64-2\">SDCL
        21-64-2</a>, no person may use any aspect of a personality's right of publicity
        for\r\n            a commercial purpose during the personality's lifetime
        or for seventy years after the death of the \r\n            personality without
        the express written consent of the personality, or if the personality is deceased
        without the express written consent of the personality's next of kin or other
        person or entity that owns the right of publicity.\r\n            </p>\r\n\r\n
        \                           <p>The provisions of this chapter apply to a personality
        who is deceased prior to July 1, 2015 <a target=\"_blank\" href=\"http://sdlegislature.gov/Statutes/Codified_Laws/DisplayStatute.aspx?Type=Statute&Statute=21-64-3\">(SDCL
        21-64-3)</a>.</p>\r\n\r\n                            <p>For specific information
        regarding definitions, termination of rights, cause of action, permitted uses
        and exclusive remedy <a target=\"_blank\" href=\"http://sdlegislature.gov/Statutes/Codified_Laws/DisplayStatute.aspx?Type=Statute&Statute=21-64\">click
        here.</a></p>\r\n\r\n                            <h3>Registration of claim
        of right of publicity by successor</h3>\r\n\r\n                            <p>Pursuant
        to <a target=\"_blank\" href=\"http://sdlegislature.gov/Statutes/Codified_Laws/DisplayStatute.aspx?Type=Statute&Statute=21-64-11\">21-64-11,</a>
        any person claiming to be a successor in interest to the right of publicity
        of a deceased personality pursuant to this chapter or a licensee thereof may
        register that claim with the secretary of state on a form prescribed by the
        secretary of state and upon payment of a one hundred dollar filing fee to
        the secretary of state.</p>\r\n  \r\n                            <p>For registration
        form, <a target=\"_blank\" href=\"/general-information/assets/ClaimantForm.pdf\">click
        here.</a></p>\r\n\r\n                            <p>The table below lists
        the registration forms currently on file with the Secretary of State.</p>\r\n
