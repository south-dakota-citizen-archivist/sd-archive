        \         <div class=\"span11\">\r\n            <h2><strong>Educator Disciplinary
        Action</strong></h2>\r\n           \r\n<p>\r\nPursuant to the authority granted
        to the Secretary of the Department of Education by <a href=\"https://sdlegislature.gov/Statutes/Codified_Laws/2042502\"
        target=\"_blank\">SDCL Chapter 13-42</a>, the Secretary may refuse to issue,
        renew, revoke, or suspend a certificate. The final decision of the Secretary
        regarding a certificate, along with the Findings of Fact and Conclusions of
        Law, are a public record (<a href=\"https://sdlegislature.gov/Statutes/Codified_Laws/2042502\"
        target=\"_blank\">SDCL 13-42-17.1</a>). If disciplinary action is imposed
        by the Secretary or a Professional Practices Commission, pursuant to <a href=\"https://www.sdlegislature.gov/Statutes/Codified_Laws/2042502\"
        target=\"_blank\">SDCL Chapter 13-42</a> and <a href=\"https://www.sdlegislature.gov/Statutes/Codified_Laws/2042573\"
        target=\"_blank\">13-43</a>, the written record and evidence from the hearing
        may be disclosed to authorities within this state, another state, the District
        of Columbia, \r\nor a territory or country in which the applicant or certficate
        holder holds a certificate or has applied for a certificate (<a href=\"https://sdlegislature.gov/Statutes/Codified_Laws/2042476\"
        target=\"_blank\">SDCL 13-42-17.1</a>). Records of revocation and suspension
        are provided to the National Association of State Directors of Teacher Education
        and Certification (NASDTEC) clearinghouse.\r\n</p>\r\n \r\n<p>\r\nFor more
        information about the complaint process or to file a complaint, visit <a href=\"https://doe.sd.gov/professionalpractices/\"
        target=\"_blank\">doe.sd.gov/professionalpractices/</a>.<br>\r\nIf you wish
        to report an educator for violating the code of ethics, please email: <a href=\"mailto:DOEEducatorEthics@state.sd.us\">DOEEducatorEthics@state.sd.us</a>.\r\n</p>\r\n
        \r\n<p>\r\nThe following individuals have action taken on their educator application
        or certification. No public or accredited school in South Dakota may <strong>employ</strong>
        an individual whose certificate has been revoked or suspended, unless they
        have been reinstated (<a href=\"https://sdlegislature.gov/Statutes/Codified_Laws/2042510\"
        target=\"_blank\">SDCL 13-43-5.1</a>). A revocation or suspension includes
        refusal to issue or renew a certificate. If any of these individuals present
        an educator certificate from any state to a school official, please notify
        the South Dakota Department of Education.\r\n</p>\r\n \r\n<p>\r\nThese files
        are dated from Jan. 1, 2010 to Aug. 5, 2026. Consult <a href=\"https://www.sd.gov/411\"
        target=\"_blank\">Educator 411</a> to confirm if an individual has an educator
        certification in South Dakota.\r\n</p>\r\n<br><br>\r\n\r\n<h5>Educator Disciplinary
