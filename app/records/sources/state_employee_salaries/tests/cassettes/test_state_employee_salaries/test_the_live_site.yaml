        class='money'>Salary/Wage</th><th><a class='title'>Pay Basis</a><div class='definition'><h4>Pay
        Basis</h4>State employee pay is typically paid either on an hourly or annual
        basis.  An hourly employee will get their hourly wage for each hour worked,
        while a salaried employee will get 1/24th of their annual salary each pay
        period.  The salary of each member of the Legislature is equal to one-fifth
        of the South Dakota median household income reported by the United States
        Census Current Population Survey and an additional per diem while in session
        for room and board.  The salary is converted to a daily rate for purposes
        of paying legislators during session.  For non-session meetings, legislators
        get a flat daily rate; as do members of boards and commissions.</div></th></tr></thead><tr><td>010001
