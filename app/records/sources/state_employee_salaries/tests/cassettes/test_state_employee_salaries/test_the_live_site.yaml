        \       <section id=\"main\">\r\n            <div id=\"pnl_Lookup\">\r\n\t\r\n
        \               <h2>State <span id=\"lbl_EmployeeTitle\"><a class='title'>Employee</a><div
        class='definition'><h4>Employee</h4>In the state's central payroll system,
        an Employee is any individual who provides service for compensation who is
        hired, elected or appointed to a position within state government.  An employee
        and an FTE (full-time equivalent) are not the same thing.  An employee is
        a person, while an FTE is equivalent to a certain number of hours worked or
        authorized to be worked.</div></span> Salary Lookup</h2>\r\n                <h5>as
        of <span id=\"lbl_DateTime\">11/10/2026 2:01:04 AM</span></h5>\r\n                <div
        class=\"fbox\">\r\n                    <div class=\"lbox left\">\r\n                        <strong>Last
        Name:</strong>\r\n                    </div>\r\n                    <div class=\"rbox\">\r\n
        \                       <input name=\"tb_LastName\" type=\"text\" id=\"tb_LastName\"
        />\r\n                        <span id=\"rfv_lastname\" class=\"required\"
        style=\"display:inline-block;visibility:hidden;\">A Last Name is Required<br/></span>\r\n
        \                   </div>\r\n                </div>\r\n                <div
        class=\"fbox\">\r\n                    <div class=\"lbox left\">\r\n                        <strong>First
        Name:</strong>\r\n                    </div>\r\n                    <div class=\"rbox\">\r\n
        \                       <input name=\"tb_FirstName\" type=\"text\" id=\"tb_FirstName\"
        />\r\n                    </div>\r\n                </div>\r\n                <div
        class=\"fbox\">\r\n                    <div class=\"lbox left\">\r\n                        <input
        id=\"cb_Inactive\" type=\"checkbox\" name=\"cb_Inactive\" />\r\n                    </div>\r\n
        \                   <div class=\"rbox\">\r\n                        Show Inactive
        Employees\r\n                    </div>\r\n                </div>\r\n      \r\n
        \               <br />\r\n                \r\n                <br />\r\n\r\n
        \               <input type=\"submit\" name=\"btn_Employee\" value=\"Display
        Employee\" onclick=\"javascript:WebForm_DoPostBackWithOptions(new WebForm_PostBackOptions(&quot;btn_Employee&quot;,
        &quot;&quot;, true, &quot;&quot;, &quot;&quot;, false, false))\" id=\"btn_Employee\"
        /><br /><br />\r\n            \r\n\r\n                <span id=\"lbl_Employee\"></span>\r\n\r\n
        \               <span id=\"lbl_Salary\"></span>\r\n            \r\n</div>\r\n
        \          \r\n            <div id=\"pnl_Instructions\">\r\n\t\r\n                \r\n
        \               \r\n                <h3>Instructions</h3>\r\n                <p>Enter
        the complete last name and first name of the employee to display, then click
        the <strong>Display Employee</strong> button. This serves as your written
        request for a specific individual&#39;s name, classification and salary under
        <a target=\"_blank\" href=\"https://sdlegislature.gov/Rules/Administrative/32940\">ARSD
        55:09:02:01</a>.</p>\r\n            \r\n                <p><strong>ARSD 55:09:02:01.
        Personnel records.</strong> The personnel file and all personnel records pertaining
        to applications for employment, personnel investigations, performance appraisals,
        donation or receipt of vested leave, health or retirement benefits, and competitive
        examination materials are confidential. An employee&#39;s name, classification,
        and salary may be released to a person upon written request. Additional information
        may be released if the request is accompanied by an authorization signed by
        the employee. Lists of employees with their home or office locations or other
        statistical compilations may only be released for legitimate state government
        purposes.</p>\r\n            \r\n            \r\n</div>\r\n\r\n        </section>\r\n
