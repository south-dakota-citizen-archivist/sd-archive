        id='stateemployeesalarylookup'><thead><tr><th><a class='title'>Pos #</a><div
        class='definition'><h4>Position</h4>Positions are defined by SDCL 3-6A-2 as
        \"a collection of duties and responsibilities assigned by the appointing authority.\"
        \ Positions are neither appropriated nor restricted in number by the legislature,
        but instead are a tool used to manage the workforce.  A position is not the
