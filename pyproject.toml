# sd-archive: a uv workspace of the Django app (app/) and shared libraries (packages/*).

[tool.uv.workspace]
members = ["app", "packages/*"]

[dependency-groups]
dev = [
    # every package with all its extras, so every test can run
    "sddocs[ocr,text,searchable,macos]",
    "sdllm[local,claude]",
    "sdfetch[impersonate,browser,warc,keychain]",
    "sdgis",
    "sdnames",
    "sdplaces[pandas,geo,address,geocode]",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-django>=4.11",
    "ruff>=0.11",
    "openpyxl>=3.1.5",
    "pytest-recording>=0.14.1",
]
analysis = [
    "folium>=0.20.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
sddocs = { workspace = true }
sdllm = { workspace = true }
sdfetch = { workspace = true }
sdgis = { workspace = true }
sdnames = { workspace = true }
sdplaces = { workspace = true }


[tool.ruff]
line-length = 100
target-version = "py312"
# Where first-party code lives, so imports sort the same as in the original projects
src = ["app", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "LOG", "G"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["app"]
testpaths = ["app/tests", "app/records/sources", "app/records/discovery", "packages/*/tests", "catalog/tests", "pipelines/elections/tests", "pipelines/motor-vehicles/tests", "pipelines/property-tax/tests", "pipelines/sales-tax/tests", "pipelines/voter-registration/tests", "pipelines/gaming/tests", "publish/tests"]
# Recorded responses (tests/cassettes/) replay and nothing records; any other request off this
# machine fails the test. Re-record with `just record <tests>`.
addopts = """-ra -m 'not network and not browser and not local_llm'
  --record-mode=none --block-network --allowed-hosts=127.0.0.1,localhost,::1"""
filterwarnings = [
    # Admin URL fields; harmless until Django 6, when https becomes the default scheme
    "ignore:The default scheme will be changed:django.utils.deprecation.RemovedInDjango60Warning",
]
markers = [
    "network: hits live servers every run, where a recording can't stand in (deselected by default; run with `just test-network`)",
    "browser: starts real browsers (slow; deselected by default; run with `just test-network`)",
    "local_llm: calls a model on this machine through Ollama (deselected by default)",
]
