repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fixtures and recordings stay exactly as the source published them
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: /tests/(fixtures|cassettes)/
      - id: end-of-file-fixer
        exclude: ^app/static/css/tailwind\.css$|/tests/(fixtures|cassettes)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # the lockfile must be committed, however large, and so must real documents used as
        # test fixtures
        exclude: ^(uv\.lock|packages/[^/]+/tests/data/.*\.pdf|app/records/sources/[^/]+/tests/fixtures/.*\.pdf)$

  # Keep notebook outputs (maps, plots, data) out of git
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: uv-lock

  # Ruff runs from the workspace environment so its version always matches uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: readme-table
        name: update the app README's sources table from the database
        entry: uv run --frozen python app/manage.py build_readme
        language: system
        files: ^app/(README\.md|seeds/sources\.toml)$
        pass_filenames: false
      - id: tailwind-build
        name: the stylesheet has every class the templates use
        # rebuilds app/static/css/tailwind.css; fails if that changed it, so stage the new one
        entry: bash -c 'cd app && npm run --silent build >/dev/null 2>&1 && git diff --quiet -- static/css/tailwind.css || { echo "app/static/css/tailwind.css was out of date and has been rebuilt, so stage it"; exit 1; }'
        language: system
        files: ^app/(.*\.(html|js|py)|static/css/input\.css)$
        exclude: ^app/static/(vendor|css/tailwind\.css)
        pass_filenames: false
      - id: django-check
        name: django check and missing migrations
        entry: bash -c 'uv run --frozen python app/manage.py check && uv run --frozen python app/manage.py makemigrations --check --dry-run'
        language: system
        types: [python]
        pass_filenames: false
