# The catalog of every dataset in the archive, and its unit of analysis.
#
# Two kinds:
#
#   grain = "aggregate"  the place itself is the unit: one row describes a county, district,
#                        precinct or the state for a period (voter registration by county).
#                        Has: geography (sdplaces kinds), period, measures, dimensions.
#
#   grain = "records"    things within a place are the unit: one row is a person, organization,
#                        filing, payment, permit or property (lobbyist registrations, permits).
#                        Has: unit (what one row is), entities (the kinds of things it names:
#                        person, organization, government, property), and place_link (how a row
#                        is tied to a place: address, county, city, geometry, district, none).
#
# Every entry has coverage: the places the dataset is meant to cover, as fully qualified Census
# GEOIDs ("0400000US46" is the state, "0500000US46081" Lawrence County, "1600000US4660020"
# Spearfish). Plain GEOIDs aren't enough: 46019 is Butte County and both District 19s. Where collection doesn't reach that far yet, notes say so. Each row's own
# place is a geoid column in the data; facts about places live in sdplaces, not here.
#
# Everything here is already public. What gets republished, and how, is decided case by case.
# Records can be rolled up into aggregates (permits per county per month); the rollup is its
# own aggregate entry pointing back to the records. Ephemeral feeds (events, menus, news) aren't
# listed. catalog/tests check every entry is complete for its grain.

# ── Aggregate: the place is the unit ──────────────────────────────────────────────────────
[[dataset]]
id = "voter-registration"
name = "Voter registration by county and party"
project = "south-dakota-voter-registration-data"
grain = "aggregate"
coverage = ["0400000US46"]
geography = ["county", "state"]
period = "monthly snapshots since 2015; election-day snapshots 1976–2014"
measures = ["registered voters"]
dimensions = ["party", "status (active/inactive)"]
source = "SD Secretary of State, voter registration by county reports (PDF)"

[[dataset]]
id = "election-results"
name = "Election results by precinct"
project = "sd-archive/pipelines/elections"
grain = "aggregate"
coverage = ["0400000US46"]
geography = ["precinct", "county", "state", "sldl", "sldu"]
period = "each election, 2008 on (electionresults.sd.gov); earlier from official returns"
measures = ["votes"]
dimensions = ["election", "race", "candidate or choice", "party"]
source = "SD Secretary of State, electionresults.sd.gov"
notes = "Candidates are named, as candidates (public role). Precinct boundaries change between elections."

[[dataset]]
id = "motor-vehicle-registrations"
name = "Motor vehicle titles and registrations by county and type"
project = "sd-archive (pipelines/motor-vehicles)"
grain = "aggregate"
coverage = ["0400000US46"]
geography = ["state", "county"]
period = "calendar year (2015 on) and month (2018 on)"
measures = ["registrations", "titles"]
dimensions = ["registration type"]
source = "SD Department of Revenue, title and registration statistics (PDF)"

[[dataset]]
id = "pistol-permits"
name = "Concealed pistol permits statewide"
project = "south-dakota-pistol-permit-stats"
grain = "aggregate"
coverage = ["0400000US46"]
geography = ["state"]
period = "snapshots, 2019 on (Wayback Machine)"
measures = ["permits"]
dimensions = ["permit type (regular, gold, enhanced)"]
source = "SD Secretary of State, pistol permit statistics page"

[[dataset]]
id = "education-district-profiles"
name = "School district profiles"
project = "south-dakota-education-dashboard"
grain = "aggregate"
coverage = ["0400000US46"]
geography = ["school_district"]
period = "school year, 2016–17 on"
measures = ["enrollment", "spending", "staffing", "outcomes", "tax levies", "valuations"]
dimensions = ["fund", "function", "object"]
suppression = "DOE suppresses cells under 10 students; keep them suppressed, never back them out"
source = "SD Department of Education, Statistical Digest"

[[dataset]]
id = "library-circulation"
name = "Spearfish library checkouts"
project = "whats-up-in-spearfish"
grain = "aggregate"
coverage = ["1600000US4660020"]  # Spearfish city
geography = ["place"]
period = "monthly"
measures = ["checkouts"]
dimensions = ["collection"]
source = "Grace Balloch Memorial Library"

