name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sd_gis_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sd_gis_hub
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: |
          uv sync --locked
          npm ci --prefix app

      - name: Pre-commit
        # readme-table rebuilds app/README.md from the local database's sources; CI's
        # database is empty, so that hook runs locally only
        env:
          SKIP: readme-table
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
