[project]
name = "sdllm"
version = "0.1.0"
description = "Language models for reading records: schema-checked extraction with quotes checked against the source, classification, a response cache, a guard on remote calls, and per-field evaluation. Local models through LiteLLM; Claude as an optional reference. No Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# local models (Ollama, LM Studio, MLX and other OpenAI-compatible servers)
local = ["litellm>=1.60"]
# Claude, as a reference model for gold sets and benchmarks
claude = ["anthropic>=0.70"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
