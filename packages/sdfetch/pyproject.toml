[project]
name = "sdfetch"
version = "0.1.1"
description = "Fetching with a raw store: HTTP with retries and per-host pauses, curl_cffi and browser fallbacks, a manifest, checkpoints, WARC/HAR and the Wayback Machine. No Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
]

[project.optional-dependencies]
impersonate = [
    "curl-cffi>=0.11",
]
browser = [
    "camoufox>=0.4",
    "nodriver>=0.47",
    "patchright>=1.55",
    "playwright>=1.55",
    "playwright-stealth>=2.0",
]
warc = [
    "warcio>=1.7",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
