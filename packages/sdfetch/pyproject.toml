[project]
name = "sdfetch"
version = "0.1.0"
description = "Fetching for the South Dakota archive: HTTP with retries, per-host pauses and block-page detection, a raw store with a manifest, checkpoints, and (later) browsers, WARC and Wayback. No Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
