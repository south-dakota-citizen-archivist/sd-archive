[project]
name = "sdfetch"
version = "0.4.0"
description = "Fetching with a raw store: paced HTTP with retries, curl_cffi and browser fallbacks, routes, sessions and logins, page watching, trusted timestamps, checkpoints, WARC/HAR and the Wayback Machine. No Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asn1crypto>=1.5",
    "pysocks>=1.7",
    "requests>=2.32",
    "tenacity>=9.0",
]

[project.optional-dependencies]
impersonate = [
    "curl-cffi>=0.11",
]
browser = [
    "camoufox[geoip]>=0.4",
    "nodriver>=0.47",
    "patchright>=1.55",
    "playwright>=1.55",
    "playwright-stealth>=2.0",
]
warc = [
    "warcio>=1.7",
]
keychain = [
    "keyring>=25",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
