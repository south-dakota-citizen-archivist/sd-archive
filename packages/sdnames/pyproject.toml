[project]
name = "sdnames"
version = "0.1.0"
description = "Names of people and organizations in public records: one normalizer in Python and SQL, kinds (person, organization, government, trust, estate), owner strings split into parties, people parsed with compound surnames, organization keys, and blocking keys. No Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyascii>=0.3.2",
    "jellyfish>=1.0",
    "nameparser>=3.0.1",
    "nicknames>=1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
