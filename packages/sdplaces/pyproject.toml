[project]
name = "sdplaces"
version = "0.1.0"
description = "South Dakota places (counties past and present, cities and towns, tribal areas) keyed by Census GEOID, the ID systems agencies use for them, and address normalization. No Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.9",
    # browser headers for every download (Census files, geocoders)
    "sdfetch",
]

[project.optional-dependencies]
# pandas helper (add_geoid)
pandas = ["pandas>=2.2"]
# boundaries and point-in-place lookups; also needed to rebuild data/places.csv
geo = ["geopandas>=1.2.0"]
# sdplaces.address
address = ["usaddress>=0.5.11", "usaddress-scourgify>=0.7.1"]
# sdplaces.geocode (Census batch geocoder, OpenStreetMap Nominatim)
geocode = ["requests>=2.32", "usaddress>=0.5.11", "usaddress-scourgify>=0.7.1"]

[tool.uv.sources]
sdfetch = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
